name = "proxy-felix"
main = "src/index.ts"
compatibility_date = "2026-09-21"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://felixmortas.com"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 10
period = 60

[env.development.vars]
ALLOWED_ORIGIN = "http://localhost:5173"

[[env.development.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
[env.development.ratelimits.simple]
limit = 10
period = 60

# Preserve the deployed migration history, then retire the obsolete
# Durable Object namespace used only for the former rate-limit counters.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v2"
deleted_classes = ["RateLimiter"]
